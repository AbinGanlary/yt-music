name: YTMusic
options:
  bundleIdPrefix: com.ytmusic
  deploymentTarget:
    iOS: "17.0"
targets:
  YTMusic:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Engine
        type: folder
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
    scheme:
      testTargets: [YTMusicTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ytmusic.swiftui
        PRODUCT_NAME: YTMusic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "YT Music"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "2.7.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  YTMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: YTMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ytmusic.swiftui.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
