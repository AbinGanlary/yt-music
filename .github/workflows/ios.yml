name: Build iOS app

# Builds the native iPhone app on a cloud Mac. It makes an UNSIGNED .ipa: no certificates or secrets are needed here.
# Sign it on your own phone with your usual tool, or import it into LiveContainer.
# Run it from the Actions tab: "Build iOS app" -> "Run workflow".
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned archive)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -project YTMusic.xcodeproj -scheme YTMusic -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
          test -d "$RUNNER_TEMP/App.xcarchive/Products/Applications/YTMusic.app"

      - name: Package the IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/YTMusic.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/YTMusic-unsigned.ipa" Payload)
          ls -lh YTMusic-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: YTMusic-unsigned.ipa
          path: YTMusic-unsigned.ipa
          retention-days: 14
